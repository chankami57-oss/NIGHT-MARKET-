        /* Tối ưu hiệu ứng lật 3D chuyên nghiệp */
        .perspective {
            perspective: 1200px;
        }
        .card-inner {
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }
        .card.revealed .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .card-front {
            transform: rotateY(180deg);
        }

        /* Lưới nền công nghệ chìm cho mặt thẻ bài */
        .tech-grid {
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

<body class="text-white min-h-screen flex flex-col items-center justify-between p-6 selection:bg-red-500 bg-black/70 backdrop-blur-xs">

    <!-- Khởi tạo Web Audio API để phát âm thanh mà không cần file ngoài -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flip') {
                // Âm thanh lật thẻ (Vút nhẹ)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'roll') {
                // Âm thanh cuộn/làm mới chợ (Sci-Fi Equip)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(450, audioCtx.currentTime + 0.15);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4);
                
                // Bộ lọc tiếng bớt chói
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                osc.disconnect(gain);
                osc.connect(filter);
                filter.connect(gain);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }
    </script>

        const targetDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown-timer").innerHTML = "ĐÃ HẾT HẠN";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Định dạng chuỗi hiển thị số có 2 chữ số (ví dụ: 05g thay vì 5g)
            const pad = (num) => String(num).padStart(2, '0');

            document.getElementById("countdown-timer").innerHTML = 
                `${days}đ ${pad(hours)}g ${pad(minutes)}p ${pad(seconds)}gi`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

                { name: "Sakura Vandal", price: 1275, img: "https://i.postimg.cc/Tw6Js98J/sakura-vandal-skin-v0-d24i7dlmf6i51-removebg-preview.png" },

            blue: {

                rate: 0.35,

            },
            purple: { 
                glow: "shadow-[0_0_25px_rgba(209,43,230,0.3)] border-[#d12be6]/70 text-[#d12be6] bg-[#d12be6]/5", 
                label: "Premium Edition",

            },

                label: "Exclusive Melee", 
                rate: 0.05,
                backImg: "https://i.postimg.cc/rR14nxg5/image.png" 
            }
        };

        function getRandomTier() {
            const roll = Math.random();
            let cumulativeRate = 0;
            for (const [tierName, tierInfo] of Object.entries(tiers)) {
                cumulativeRate += tierInfo.rate;
                if (roll < cumulativeRate) return tierName;
            }
            return "green"; 
        }

        function getRandomDiscount() {
            return Math.floor(Math.random() * (49 - 11 + 1)) + 11;
        }

        function generateNightMarket() {
            const container = document.getElementById("market-container");
            container.innerHTML = ""; 
            const chosenSkinNames = [];

            for (let i = 0; i < 6; i++) {
                let tier, randomSkin;
                let attempts = 0; 

                do {
                    tier = getRandomTier();
                    const skinsInTier = skinDatabase[tier];
                    randomSkin = skinsInTier[Math.floor(Math.random() * skinsInTier.length)];
                    attempts++;
                } while (chosenSkinNames.includes(randomSkin.name) && attempts < 100);

                chosenSkinNames.push(randomSkin.name);

                const tierInfo = tiers[tier];
                const discount = getRandomDiscount();
                const originalPrice = randomSkin.price;
                const discountedPrice = Math.floor(originalPrice * (1 - discount / 100));

                const cardDiv = document.createElement("div");
                cardDiv.className = "card w-full perspective cursor-pointer group/card";
                cardDiv.style = `aspect-ratio: 1 / 1.48;`; 
                
                cardDiv.innerHTML = `
                    <div class="card-inner relative w-full h-full text-center rounded-md border border-white/5 bg-[#090b11] shadow-2xl flex flex-col justify-between">
                        
                        <div class="card-front tech-grid rounded-md border-2 ${tierInfo.glow} overflow-hidden bg-gradient-to-b from-[#0e121d] to-[#06080d] flex flex-col justify-between p-4.5">
                            
                            <div class="w-full flex justify-end z-10">
                                <span class="text-[9px] uppercase px-2 py-0.5 rounded-xs bg-black/80 font-sans-custom tracking-widest font-extrabold border border-white/10 text-white/90">
                                    ${tierInfo.label}
                                </span>
                            </div>
                            
                            <div class="absolute inset-0 w-full h-full z-0 flex items-center justify-center p-3">
                                <img src="${randomSkin.img}" alt="${randomSkin.name}" class="w-full max-h-[50%] object-contain drop-shadow-[0_8px_16px_rgba(0,0,0,0.8)] transition-transform duration-500 group-hover/card:scale-105">
                                <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-[#05070c] via-[#05070c]/70 to-transparent"></div>
                            </div>

                            <div class="w-full text-left z-10 font-sans-custom mt-auto">
                                <h3 class="font-bold font-sans-custom tracking-wide line-clamp-2 uppercase text-xs mb-2.5 text-white drop-shadow-[0_2px_4px_rgba(0,0,0,1)]">
                                    ${randomSkin.name}
                                </h3>
                                
                                <div class="flex justify-between items-center bg-black/60 p-2 rounded-xs border border-white/5 backdrop-blur-xs">
                                    <div class="text-left">
                                        <div class="text-[10px] text-gray-500 line-through font-medium leading-none mb-1">${originalPrice} VP</div>
                                        <div class="text-sm font-extrabold text-white tracking-wide flex items-center gap-1 leading-none">
                                            <span class="text-xs text-red-400 font-sans font-bold">Ⓥ</span> ${discountedPrice.toLocaleString()}
                                        </div>
                                    </div>
                                    <div class="text-xs font-extrabold text-red-500 bg-red-950/50 px-2 py-1 rounded-xs border border-red-500/20 shadow-[inset_0_0_6px_rgba(239,68,68,0.2)]">
                                        -${discount}%
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-back rounded-md overflow-hidden border border-white/5 hover:border-red-500/30 transition-all duration-300 bg-[#070a10] shadow-inner">
                            <img src="${tierInfo.backImg}" alt="Market Card Back" class="w-full h-full object-cover opacity-85 group-hover/card:opacity-100 transition-opacity duration-300 select-none pointer-events-none">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
                        </div>

                    </div>
                `;

                cardDiv.addEventListener("click", function() {
                    if (!this.classList.contains("revealed")) {
                        playSound('flip');
                        this.classList.add("revealed");
                    }
                });

                container.appendChild(cardDiv);
            }
        }

        function revealAllCards() {
            const unrevealedCards = document.querySelectorAll('.card:not(.revealed)');
            if(unrevealedCards.length > 0) {
                playSound('flip');
                unrevealedCards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('revealed');
                    }, index * 80);
                });
            }
        }

        window.onload = generateNightMarket;
    </script>
</body>
